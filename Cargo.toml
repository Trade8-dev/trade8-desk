[package]
name = "trade8-desk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Trade8-dev/trade8-desk"
rust-version = "1.85"
description = "Sentin8 trade8 desk service."

[[bin]]
name = "trade8-desk"
path = "src/main.rs"

[features]
default = []
# Tree-layout-only flow tests: enables the cross-repo `#[path]` embed of
# the real risk engine (tests/flow.rs - see its header). CI (single-repo
# checkout) leaves this OFF; the aggregation-tree operator turns it on.
cross_repo_flows = []
# Never compiled as-is (see src/main.rs handler_tests gate) - placeholder
# for the SDK-side test-harness OIDC stand-in (backlog T8-HARNESS-1).
handler_tests = []

[dependencies]
# Platform SDK pin (RS 2.3) - the only cross-repo dependency; carries the
# entire shared library workspace behind the `sentin8` facade.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.6" }
utoipa = { version = "5", features = ["chrono", "uuid"] }
# trade8 namespace facade pin - carries this vertical's contracts/clients.
trade8 = { git = "https://github.com/Trade8-dev/trade8-sdk", tag = "trade8-v0.5.6" }

anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["macros", "ws"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "rust_decimal"] }
tower = { version = "0.5", features = ["util", "util"], default-features = false }
http-body-util = "0.1"
